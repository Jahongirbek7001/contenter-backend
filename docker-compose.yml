services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: contentor
      POSTGRES_PASSWORD: contentor
      POSTGRES_DB: contentor
    ports:
      - "15433:5432"  # 5432 falls in a Windows reserved port range
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contentor"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"

volumes:
  postgres_data:
