# /etc/nginx/sites-available/api.contentor.wtf
# HTTP only at first; `certbot --nginx -d api.contentor.wtf` adds HTTPS and the redirect.
server {
    listen 80;
    listen [::]:80;
    server_name api.contentor.wtf;

    # Selfies are at most 10 MB; trend previews uploaded from the admin cabinet up to 60 MB.
    client_max_body_size 60m;

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
