# Production on the Contabo VPS: docker compose -f compose.prod.yml up -d --build
# Secrets come from .env next to this file (template: deploy/production.env.example).
# The server's nginx (shared with other projects) terminates HTTPS for api.contentor.wtf and
# proxies to 127.0.0.1:8100 (deploy/nginx-api.conf); nothing else is published.

name: contentor

x-app: &app
  build: .
  image: contentor-backend
  env_file: .env
  environment:
    GOOGLE_APPLICATION_CREDENTIALS: /app/credentials/service-account.json
    MEDIA_DIR: /app/var/media
  volumes:
    - media:/app/var/media
    - ./credentials:/app/credentials:ro
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started
    migrate:
      condition: service_completed_successfully
  restart: unless-stopped
  logging: &logging
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: contentor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: contentor
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contentor"]
      interval: 5s
      retries: 20
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:7-alpine
    # Persists the bot's conversation state and queued jobs across restarts.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    restart: unless-stopped
    logging: *logging

  migrate:
    build: .
    image: contentor-backend
    env_file: .env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *logging

  api:
    <<: *app
    # Ports 8000 and 3001 are taken by other projects on this server.
    ports:
      - "127.0.0.1:8100:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  bot:
    <<: *app
    command: ["python", "-m", "app.bot"]

  worker:
    <<: *app
    command: ["arq", "app.worker.WorkerSettings"]
    # ffmpeg and video downloads; the server is shared, so one runaway job must not
    # starve the other projects.
    deploy:
      resources:
        limits: { memory: 2g }

volumes:
  pgdata:
  redisdata:
  media:
